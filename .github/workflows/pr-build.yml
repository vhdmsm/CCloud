          echo "OMDB_API_KEY25=${{ secrets.OMDB_API_KEY25 }}" >> secrets.properties
          echo "OMDB_API_KEY26=${{ secrets.OMDB_API_KEY26 }}" >> secrets.properties
          echo "OMDB_API_KEY27=${{ secrets.OMDB_API_KEY27 }}" >> secrets.properties
