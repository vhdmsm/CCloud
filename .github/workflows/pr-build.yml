          echo "OMDB_API_KEY19=${{ secrets.OMDB_API_KEY19 }}" >> secrets.properties
          echo "OMDB_API_KEY20=${{ secrets.OMDB_API_KEY20 }}" >> secrets.properties
          echo "OMDB_API_KEY21=${{ secrets.OMDB_API_KEY21 }}" >> secrets.properties
          echo "OMDB_API_KEY22=${{ secrets.OMDB_API_KEY22 }}" >> secrets.properties
          echo "OMDB_API_KEY23=${{ secrets.OMDB_API_KEY23 }}" >> secrets.properties
