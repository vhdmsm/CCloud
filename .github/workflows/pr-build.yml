          echo "WATCHMODE_API_KEY37=${{ secrets.WATCHMODE_API_KEY37 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY38=${{ secrets.WATCHMODE_API_KEY38 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY39=${{ secrets.WATCHMODE_API_KEY39 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY40=${{ secrets.WATCHMODE_API_KEY40 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY41=${{ secrets.WATCHMODE_API_KEY41 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY42=${{ secrets.WATCHMODE_API_KEY42 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY43=${{ secrets.WATCHMODE_API_KEY43 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY44=${{ secrets.WATCHMODE_API_KEY44 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY45=${{ secrets.WATCHMODE_API_KEY45 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY46=${{ secrets.WATCHMODE_API_KEY46 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY47=${{ secrets.WATCHMODE_API_KEY47 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY48=${{ secrets.WATCHMODE_API_KEY48 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY49=${{ secrets.WATCHMODE_API_KEY49 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY50=${{ secrets.WATCHMODE_API_KEY50 }}" >> secrets.properties
          # Beyond OMDB_API_KEY50 / WATCHMODE_API_KEY50, any number of keys without changing anything here:
          # the OMDB_API_KEYS and WATCHMODE_API_KEYS secrets, one key per line, written as one comma-separated line
          echo "OMDB_API_KEYS=$(echo "$OMDB_API_KEYS" | tr -s ' ,\r\n' ',')" >> secrets.properties
          echo "WATCHMODE_API_KEYS=$(echo "$WATCHMODE_API_KEYS" | tr -s ' ,\r\n' ',')" >> secrets.properties

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      # Release build (minified like the published APK), signed with the debug key
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CCloud-pr-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
