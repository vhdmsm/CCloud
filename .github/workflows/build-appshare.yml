          echo "WATCHMODE_API_KEY45=${{ secrets.WATCHMODE_API_KEY45 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY46=${{ secrets.WATCHMODE_API_KEY46 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY47=${{ secrets.WATCHMODE_API_KEY47 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY48=${{ secrets.WATCHMODE_API_KEY48 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY49=${{ secrets.WATCHMODE_API_KEY49 }}" >> secrets.properties
          echo "WATCHMODE_API_KEY50=${{ secrets.WATCHMODE_API_KEY50 }}" >> secrets.properties
          # Beyond OMDB_API_KEY50 / WATCHMODE_API_KEY50, any number of keys without changing anything here:
          # the OMDB_API_KEYS and WATCHMODE_API_KEYS secrets, one key per line, written as one comma-separated line
          echo "OMDB_API_KEYS=$(echo "$OMDB_API_KEYS" | tr -s ' ,\r\n' ',')" >> secrets.properties
          echo "WATCHMODE_API_KEYS=$(echo "$WATCHMODE_API_KEYS" | tr -s ' ,\r\n' ',')" >> secrets.properties
        continue-on-error: true

      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace -x lint

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-universal-release.apk release/CCloud-universal.apk

      - name: Get tag name
        id: get_tag
        run: |
          if [[ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
            TAG_NAME=${{ github.event.inputs.tag }}
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Tag name: $TAG_NAME"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            release/CCloud-universal.apk
          body: |
            ## CCloud Release ${{ env.TAG_NAME }}
            
            ### What's New
            - Modernized UI with enhanced user experience
            - Improved performance and stability
            - New features and bug fixes
            
            ### Download Options
            - [Universal APK (all architectures)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/CCloud-universal.apk) - Compatible with all devices

            ### Installation
            1. Download the appropriate APK file for your device
            2. Enable "Install from unknown sources" in your device settings
            3. Open and install the APK
            4. Launch CCloud and enjoy your movies!